[project]
name = "gemini-seo"
version = "2.3.1"
description = "Comprehensive SEO analysis skill for Gemini / Antigravity"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Daniel Agrici"}
]
keywords = ["seo", "gemini", "antigravity", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/AgriciDaniel/gemini-seo"
Repository = "https://github.com/AgriciDaniel/gemini-seo"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
